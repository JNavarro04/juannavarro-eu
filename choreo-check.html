<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>choreo check</title>
    <script>
      // TEMPORARY verification harness. The review pane reports
      // document.visibilityState === 'hidden', so rAF never fires and even
      // setTimeout is throttled to ~1Hz — nothing converges and nothing paints.
      // A MessageChannel is not throttled, so this drives both r3f's loop and
      // the choreography's loop from the page's own event loop. It self-limits
      // to the render cost because each loop re-arms from inside its callback.
      // Any frame rate measured under this is meaningless.
      // Another agent is editing Sphere/** live, so Vite full-reloads this page
      // without warning. Scroll restoration would then fight every scrollTo.
      history.scrollRestoration = 'manual'
      window.__rafShim = true
      window.requestAnimationFrame = (cb) => window.setTimeout(() => cb(performance.now()), 16)
      // Must be shimmed together: a setTimeout handle cannot be cancelled by the
      // native cancelAnimationFrame, and an uncancellable loop would survive
      // every unmount and make the cleanup impossible to test.
      window.cancelAnimationFrame = (id) => window.clearTimeout(id)
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/choreoCheck.tsx"></script>
  </body>
</html>
