<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="JN">
  <!--
    JN monogram. One mark rather than two letters: the N's left stem carries on
    below the baseline and hooks left, so the J is read out of the N instead of
    sitting beside it. That keeps the counters open at 16px, where a separate
    J and N would close up into a smudge.

    Ink tile with a white mark, not the site's ice white — a near-white favicon
    vanishes against a light tab strip, and this has to hold in both browser
    themes.
  -->
  <rect width="32" height="32" rx="7" fill="#14181b"/>
  <g fill="none" stroke="#f4f6f7" stroke-width="2.4"
     stroke-linecap="round" stroke-linejoin="round">
    <!-- left stem, descending into the J hook -->
    <path d="M11 8.5 V21 C11 24.4 8.6 25.4 6.9 23.8"/>
    <!-- diagonal -->
    <path d="M11 8.5 L21 21.5"/>
    <!-- right stem -->
    <path d="M21 8.5 V21.5"/>
  </g>
</svg>
